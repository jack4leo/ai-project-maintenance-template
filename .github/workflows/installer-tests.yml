name: Installer regression tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  installer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate review exclusion policy
        run: python3 scripts/freeze-review-range.py --validate-policy docs/automation/range-exclusions.json
      - name: Run installer regression tests
        run: bash tests/test-install.sh
      - name: Test Lesson promotion validator
        run: python3 tests/test_lesson_promotions.py
